<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GRAM BASKET</title><style>* {  box-sizing: border-box;}body {  margin: 0;  font-family: Arial, sans-serif;  background: #f3f7f2;  color: #222;}header {  background: #16753b;  color: white;  padding: 18px;  text-align: center;}header h1 {  margin: 0;  font-size: 27px;}header p {  margin-bottom: 0;}.search {  width: 92%;  padding: 13px;  margin: 15px 4%;  border: 1px solid #ccc;  border-radius: 8px;  font-size: 16px;}h2 {  padding-left: 12px;}.products {  display: grid;  grid-template-columns: repeat(2, minmax(0, 1fr));  gap: 12px;  padding: 12px;}.card {  background: white;  border-radius: 10px;  padding: 14px 10px;  text-align: center;  box-shadow: 0 2px 7px #ddd;}.emoji {  font-size: 38px;}.card h3 {  margin: 8px 0;}.price {  color: #16753b;  font-weight: bold;}button {  background: #16753b;  color: white;  border: 0;  border-radius: 7px;  padding: 11px;  cursor: pointer;  font-size: 15px;}.card button {  width: 100%;  margin-top: 8px;}section {  background: white;  margin: 14px 12px;  padding: 15px;  border-radius: 10px;}input, textarea {  width: 100%;  padding: 12px;  margin: 7px 0;  border: 1px solid #bbb;  border-radius: 7px;  font-size: 16px;}.order-button {  width: 100%;  margin-top: 10px;}#message {  font-weight: bold;  color: #16753b;}footer {  text-align: center;  padding: 20px;  color: #666;}</style></head><body><header>  <h1>🛒 GRAM BASKET</h1>  <p>आपके गाँव की अपनी किराना दुकान</p></header><input  id="search"  class="search"  type="search"  placeholder="🔍 सामान खोजें..."  oninput="showProducts()"><h2>🛍️ किराना सामान</h2><div id="products" class="products"></div><section>  <h2>🛒 आपका कार्ट</h2>  <div id="cart">अभी कार्ट खाली है।</div>  <h3 id="total">कुल: ₹0</h3></section><section>  <h2>📦 ऑर्डर की जानकारी</h2>  <form id="orderForm">    <input id="customerName" placeholder="आपका पूरा नाम" required>    <input id="mobile" type="tel"      inputmode="numeric"      pattern="[0-9]{10}"      maxlength="10"      placeholder="10 अंकों का मोबाइल नंबर"      required>    <textarea id="address"      placeholder="गाँव, पोस्ट और पूरा पता"      required></textarea>    <button class="order-button" type="submit">      ऑर्डर तैयार करें    </button>  </form>  <p id="message"></p></section><footer>  GRAM BASKET © 2026</footer><script>const items = [  {id: 1, name: "चावल 1 kg", price: 60, emoji: "🍚"},  {id: 2, name: "आटा 1 kg", price: 40, emoji: "🌾"},  {id: 3, name: "चीनी 1 kg", price: 45, emoji: "🧂"},  {id: 4, name: "खाने का तेल 1 L", price: 140, emoji: "🛢️"},  {id: 5, name: "दाल 1 kg", price: 110, emoji: "🫘"},  {id: 6, name: "नमक 1 kg", price: 20, emoji: "🧂"},  {id: 7, name: "बिस्कुट", price: 10, emoji: "🍪"},  {id: 8, name: "साबुन", price: 35, emoji: "🧼"},  {id: 9, name: "चाय 250 g", price: 90, emoji: "🍵"},  {id: 10, name: "मैगी", price: 15, emoji: "🍜"}];const cart = {};function showProducts() {  const query = document.getElementById("search")    .value.toLowerCase();  const filtered = items.filter(item =>    item.name.toLowerCase().includes(query)  );  document.getElementById("products").innerHTML =    filtered.map(item => `      <div class="card">        <div class="emoji">${item.emoji}</div>        <h3>${item.name}</h3>        <p class="price">₹${item.price}</p>        <button onclick="addItem(${item.id})">          + कार्ट में जोड़ें        </button>      </div>    `).join("");}function addItem(id) {  cart[id] = (cart[id] || 0) + 1;  showCart();}function changeQty(id, amount) {  cart[id] = (cart[id] || 0) + amount;  if (cart[id] <= 0) {    delete cart[id];  }  showCart();}function showCart() {  const selected = items.filter(item => cart[item.id]);  const box = document.getElementById("cart");  if (selected.length === 0) {    box.textContent = "अभी कार्ट खाली है।";  } else {    box.innerHTML = selected.map(item => `      <p>        ${item.name} — ₹${item.price * cart[item.id]}        <button onclick="changeQty(${item.id}, -1)">−</button>        ${cart[item.id]}        <button onclick="changeQty(${item.id}, 1)">+</button>      </p>    `).join("");  }  const sum = selected.reduce(    (total, item) => total + item.price * cart[item.id], 0  );  document.getElementById("total").textContent = "कुल: ₹" + sum;}document.getElementById("orderForm").addEventListener(  "submit", function(event) {    event.preventDefault();    if (Object.keys(cart).length === 0) {      alert("पहले कार्ट में सामान जोड़ें।");      return;    }    const order = {      customerName: document.getElementById("customerName").value,      mobile: document.getElementById("mobile").value,      address: document.getElementById("address").value,      items: items        .filter(item => cart[item.id])        .map(item => ({          name: item.name,          price: item.price,          quantity: cart[item.id]        })),      total: items.reduce(        (sum, item) => sum + item.price * (cart[item.id] || 0), 0      )    };    document.getElementById("message").textContent =      "फॉर्म सही है। अभी ऑर्डर केवल इस डेमो में तैयार हुआ है; दुकान पर भेजा नहीं गया।";    console.log(order);  });showProducts();showCart();</script></body></html>
