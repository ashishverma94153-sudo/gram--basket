<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAM BASKET Admin</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f3f7f2;margin:0;color:#222}header{background:#16753b;color:white;text-align:center;padding:18px}main{max-width:800px;margin:auto;padding:12px}section{background:white;border-radius:10px;padding:14px;margin:12px 0}input{width:100%;padding:11px;margin:6px 0;border:1px solid #bbb;border-radius:7px}button{padding:10px 12px;background:#16753b;color:white;border:0;border-radius:7px;margin:4px 0}button.delete{background:#a52828}.row{border-bottom:1px solid #ddd;padding:12px 0}#panel{display:none}</style></head><body><header><h1>🔐 GRAM BASKET Admin</h1><p>Product Management</p></header><main><section><h2>Admin Login</h2><p style="color:red;font-weight:bold">TEST: नया Admin पेज खुला</p><form id="login"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Admin password" required><button>Login</button></form><p id="status"></p><button id="logout" style="display:none;background:#555">Logout</button></section><div id="panel"><section><h2>➕ नया सामान जोड़ें</h2><input id="name" placeholder="सामान का नाम"><input id="category" placeholder="कैटेगरी"><input id="emoji" placeholder="इमोजी" value="🛒"><input id="pack" placeholder="पैक / मात्रा"><input id="price" type="number" min="0.01" step="0.01" placeholder="कीमत ₹"><button id="add">सामान जोड़ें</button></section><section><h2>🛠️ सामान बदलें / हटाएँ</h2><div id="list"></div></section></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getFirestore,collection,getDocs,doc,setDoc}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";const app=initializeApp({apiKey:"AIzaSyDAqK1tjy1UzRGV11N47S0zxqbqBLnGjHs",authDomain:"gram-basket.firebaseapp.com",projectId:"gram-basket",storageBucket:"gram-basket.firebasestorage.app",messagingSenderId:"334817273306",appId:"1:334817273306:web:7876254dcc3a83801e8ce3"});const db=getFirestore(app),auth=getAuth(app),ADMIN_UID="gP0392TzG0Ot1P7uw65Hke8nQUL2";let rows=[];const $=id=>document.getElementById(id);function allowed(){return auth.currentUser&&auth.currentUser.uid===ADMIN_UID}async function load(){const s=await getDocs(collection(db,"Products"));rows=s.docs.map(d=>({...d.data(),id:d.id})).filter(p=>p.isActive!==false);render()}function render(){$("list").innerHTML=rows.map(p=>`<div class="row"><b>${p.emoji||"🛒"} ${p.name}</b><input id="n-${p.id}" value="${String(p.name||"").replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}" placeholder="नाम"><input id="c-${p.id}" value="${String(p.category||"").replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}" placeholder="कैटेगरी"><input id="e-${p.id}" value="${p.emoji||"🛒"}" placeholder="इमोजी"><input id="k-${p.id}" value="${String(p.pack||"").replace(/&/g,"&amp;").replace(/\"/g,"&quot;")}" placeholder="पैक"><input id="p-${p.id}" type="number" min="0" step="0.01" value="${p.packPrice||0}" placeholder="कीमत"><button onclick="window.save('${p.id}')">बदलाव सेव करें</button><button class="delete" onclick="window.removeP('${p.id}')">हटाएँ</button></div>`).join("")||"कोई सामान नहीं मिला।"}window.save=async id=>{if(!allowed())return;const p=rows.find(x=>x.id===id);const v={...p,name:$(`n-${id}`).value.trim(),category:$(`c-${id}`).value.trim(),emoji:$(`e-${id}`).value.trim()||"🛒",pack:$(`k-${id}`).value.trim(),packPrice:Number($(`p-${id}`).value),isActive:true};if(!v.name||!v.category||!v.pack||!Number.isFinite(v.packPrice)||v.packPrice<0){alert("सही जानकारी भरें");return}try{await setDoc(doc(db,"Products",id),v);await load();$("status").textContent="सामान अपडेट हो गया।"}catch(e){alert("सेव नहीं हुआ: "+e.message)}};window.removeP=async id=>{if(!allowed()||!confirm("सामान वेबसाइट से हटाएँ?"))return;try{const p=rows.find(x=>x.id===id);await setDoc(doc(db,"Products",id),{...p,isActive:false});await load();$("status").textContent="सामान छिपा दिया गया।"}catch(e){alert("हटाया नहीं गया: "+e.message)}};$("login").addEventListener("click",()=> {
  $("login").addEventListener("click",()=> {
  $("status").textContent = "Login बटन काम कर रहा है";
});
});$("login").addEventListener("submit",async e=>{e.preventDefault();try{const c=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);if(c.user.uid!==ADMIN_UID){await signOut(auth);throw Error("यह खाता अधिकृत Admin नहीं है")};$("status").textContent="लॉगिन सफल";$("panel").style.display="block";$("logout").style.display="inline-block";await load()}catch(e){$("status").textContent="लॉगिन विफल: "+e.message}});$("logout").onclick=async()=>{await signOut(auth);$("panel").style.display="none";$("logout").style.display="none"};onAuthStateChanged(auth,u=>{if(u&&u.uid===ADMIN_UID){$("panel").style.display="block";$("logout").style.display="inline-block";load().catch(e=>$("status").textContent="डेटा लोड नहीं हुआ: "+e.message)}});$("add").onclick=async()=>{if(!allowed())return;const name=$("name").value.trim(),category=$("category").value.trim(),emoji=$("emoji").value.trim()||"🛒",pack=$("pack").value.trim(),packPrice=Number($("price").value);if(!name||!category||!pack||!Number.isFinite(packPrice)||packPrice<=0){alert("नाम, कैटेगरी, पैक और सही कीमत भरें");return}const id="custom_"+Date.now(),p={id,name,category,emoji,pack,packPrice,packSalePrice:0,packKg:0,loose:false,loosePricePerKg:0,looseSalePricePerKg:0,isActive:true};try{await setDoc(doc(db,"Products",id),p);["name","category","pack","price"].forEach(x=>$(x).value="");await load();$("status").textContent="नया सामान सेव हो गया। ग्राहक वेबसाइट में दिखने के लिए index.html का अपडेटेड वर्ज़न भी लगाएँ।"}catch(e){alert("सामान सेव नहीं हुआ: "+e.message)}};window.addEventListener("error", function(e) {
  document.getElementById("status").textContent =
    "JavaScript Error: " + e.message;
});

window.addEventListener("unhandledrejection", function(e) {
  document.getElementById("status").textContent =
    "Firebase Error: " + (e.reason?.message || e.reason);
});</script></body></html>
